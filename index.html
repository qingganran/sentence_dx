<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>英语练习｜听力+默写｜离线音标版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%232563eb'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EAa%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #fffbe6; /* 浅黄色整体背景 */
    --paper: #ffffff;
    --ink: #1f2937;
    --muted: #6b7280;
    --line: #d1d5db;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --green: #16a34a;
    --red: #dc2626;
    --amber-bg: #fef3c7;
    --amber-border: #d97706;
    --amber-ink: #92400e;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
    min-height: 100vh;
  }
  /* 顶部操作按钮栏 */
  .top-action-bar{
    display:flex;
    flex-direction: column;
    gap:10px;
    padding:14px 16px;
    align-items:center;
  }
  .bar-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .action-btn{
    padding:11px 20px;
    border:none;
    border-radius:8px;
    font-size:15px;
    font-weight:500;
    cursor:pointer;
  }
  .btn-import{ background:#bfdbfe; color:#1e40af; }
  .btn-vocab{ background:#fed7aa; color:#c2410c; }
  .btn-shuffle{ background:#fecdd3; color:#be123c; }
  .btn-readzh{ background:#d9f99d; color:#4d7c0f; }
  .btn-phonetic{ background:#c4b5fd; color:#5b21b6; }
  .btn-listen{ background:#bbf7d0; color:#15803d; }
  .btn-write{ background:#ddd6fe; color:#6d28d9; }
  .action-btn:hover{ filter:brightness(0.92); }
  .action-btn.active{ outline:2px solid #222; }
  .view { display: none; min-height: calc(100vh - 130px); padding: 16px; }
  .view.active { display: block; }
  textarea {
    width: 100%; min-height: 220px; padding: 14px;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--paper); font-size: 16px; font-family: inherit;
    resize: vertical;
  }
  textarea:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
  /* 默写面板 */
  #write-panel { max-width: 900px; margin: 0 auto; display: none; flex-direction: column; }
  #write-panel.active { display: flex; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 10px;
  }
  .progress { color: var(--muted); font-size: 14px; }
  .topbar-spacer { width: 96px; }
  .hint {
    text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 12px;
  }
  .zh-box {
    text-align: center; font-size: 20px; padding: 12px 8px;
    color: var(--primary); font-weight: 500; line-height: 1.4;
    min-height: 48px;
  }
  .words {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 14px 20px; padding: 20px 0; flex: 1; align-content: center;
  }
  .word-input {
    background: transparent; border: none;
    border-bottom: 2px solid #333;
    font-size: 20px; font-family: "Courier New", monospace;
    text-align: center; padding: 4px 4px; color: var(--ink);
    min-width: 60px; max-width: 200px;
  }
  .word-input:focus { outline: none; border-bottom-color: var(--primary); }
  .word-input.err { color: var(--red); border-bottom-color: var(--red); }
  .word-input.ok { color: var(--green); border-bottom-color: var(--green); }
  .en-hint {
    display: none;
    background: var(--amber-bg); border: 1px dashed var(--amber-border);
    color: var(--amber-ink); border-radius: var(--radius);
    padding: 10px 12px; margin: 8px 0; text-align: center;
    font-size: 15px; line-height: 1.5;
  }
  .en-hint.show { display: block; }
  .result {
    display: none;
    background: #f0fdf4; border: 1px solid #86efac;
    border-radius: var(--radius); padding: 10px 14px;
    margin: 8px 0; text-align: center; font-size: 15px; line-height: 1.6;
    white-space: pre-line;
  }
  .result.show { display: block; }
  .nav-row {
    display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; flex-wrap: wrap;
  }
  .btn-next {
    background: var(--green); color: #fff; padding: 10px 22px;
  }
  .btn-prev {
    background: #e5e7eb; color: var(--ink); padding: 10px 18px;
  }
  .btn-hint-mobile {
    background: #fef3c7; color: var(--amber-ink);
    padding: 8px 16px; font-size: 14px; min-height:40px;
    border-radius:20px;
    border:none;
    cursor:pointer;
  }
  .err-tip {
    display: none;
    background: #fee2e2; border: 1px dashed var(--red);
    color: #991b1b; border-radius: var(--radius);
    padding: 10px 12px; margin: 8px 0; text-align: center;
    font-size: 15px; line-height: 1.5;
  }
  .err-tip.show { display: block; }
  .err-tip b { font-family: "Courier New", monospace; font-size: 17px; }
  .speak-bar {
    display: flex; gap: 10px; justify-content: center;
    margin: 6px 0 4px; flex-wrap: wrap;
  }
  .btn-speak {
    padding: 8px 16px; font-size: 14px; min-height: 40px;
    border-radius: 20px;
    border:none;
    cursor:pointer;
  }
  .btn-speak {
    background: #eef2ff; color: #4338ca;
  }
  /* 听力模式面板 */
  #listen-panel{max-width:900px;margin:0 auto;}
  .listen-topbar{
    display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px;
  }
  .listen-progress{font-size:14px;color:var(--muted);}
  .listen-card{
    background:#ffffff;
    border-radius:var(--radius);
    padding:24px 16px;
    box-shadow:0 2px 10px #00000012;
    text-align:center;
  }
  .listen-en-wrap{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px 18px;
    margin:20px 0;
  }
  .listen-word-item{
    text-align:center;
  }
  .listen-word-en{
    font-size:22px;
    font-weight:600;
  }
  .listen-word-phonetic{
    font-size:13px;
    color:#64748b;
    margin-top:4px;
    font-style:italic;
  }
  .listen-zh-text{
    font-size:20px;
    color:#2563eb;
    margin:16px 0;
  }
  .listen-nav{
    display:flex;
    gap:12px;
    justify-content:center;
    margin-top:20px;
    flex-wrap:wrap;
  }
  .auto-tip{
    font-size:12px;color:#94a3b8;margin-top:8px;
  }
  @media (min-width: 768px) {
    .view { padding: 24px; }
    .zh-box { font-size: 24px; }
    .listen-word-en{font-size:26px;}
  }
  .modal-mask {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45);
    z-index: 999; align-items: center; justify-content: center; padding: 16px;
  }
  .modal-mask.show { display: flex; }
  .modal-box {
    background: #fff; border-radius: 14px; padding: 18px; width: 100%;
    max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,.2);
  }
  .modal-title {
    font-size: 18px; font-weight: 700; text-align: center; margin-bottom: 6px;
  }
  .modal-sub { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .modal-option {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 12px 14px; margin-bottom: 10px; text-align: left;
    background: #f8fafc; border: 1px solid var(--line); border-radius: 10px;
    font-size: 14px; min-height: 46px;
  }
  .modal-option:hover { border-color: var(--primary); background: #eff6ff; }
  .modal-option .tag {
    flex-shrink: 0; font-size: 12px; color: #fff; border-radius: 6px;
    padding: 2px 8px; background: var(--primary);
  }
  .modal-option .tag.art { background: #7c3aed; }
  .modal-option .tag.custom { background:#9333ea; }
  .modal-option .tag.file { background: #6b7280; }
  .modal-close {
    display: block; width: 100%; margin-top: 6px; padding: 10px;
    background: #e5e7eb; color: var(--ink); border-radius: 10px; font-size: 14px;
  }
  .modal-paste {
    width: 100%; min-height: 100px; padding: 10px; margin: 4px 0 10px;
    border: 1px solid var(--line); border-radius: 10px;
    font-size: 15px; font-family: inherit; resize: vertical;
  }
  .modal-paste:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
  .grade-group {
    border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 10px; margin-bottom: 10px; background: #f8fafc;
  }
  .grade-head {
    display: flex; align-items: center; gap: 8px; font-size: 14px;
    font-weight: 700; margin-bottom: 8px;
  }
  .grade-head .tag { font-size: 12px; padding: 2px 8px; border-radius: 6px; color: #fff; }
  .grade-head .tag.art { background: #7c3aed; }
  .grade-head .tag.custom {background:#9333ea;}
  .unit-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
  }
  .unit-btn {
    padding: 7px 2px; border: 1px solid var(--line); border-radius: 6px;
    background: #fff; font-size: 12.5px; min-height: 34px; cursor: pointer;
    text-align: center;
  }
  .unit-btn:hover { border-color: var(--primary); background: #eff6ff; }
  .del-btn{
    border:none;
    background:transparent;
    font-size:16px;
    color:red;
    cursor:pointer;
    padding:0;
    line-height:1;
  }
  .custom-wrap{
    display:flex;
    gap:4px;
    align-items:center;
  }
  .correct-bar {
    margin: 0 0 10px 0; padding: 8px 14px; border-radius: 10px;
    background: #f0fdf4; border: 1px solid #bbf7d0;
    font-size: 14px; color: #15803d; line-height: 1.7;
    display: none;
  }
  .correct-bar.show { display: block; }
  .correct-bar b { color: #166534; }
  .correct-bar .item { display: inline-block; margin-right: 10px; }
  .vocab-mask {
    position: fixed; inset: 0; background: rgba(15,23,42,.5);
    display: none; align-items: center; justify-content: center; z-index: 100;
  }
  .vocab-mask.show { display: flex; }
  .vocab-box {
    background: #fff; border-radius: 14px; padding: 18px 20px;
    width: min(620px, 92vw); max-height: 80vh; overflow: auto;
    box-shadow: 0 12px 40px rgba(0,0,0,.18);
  }
  .vocab-title { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .vocab-sub { font-size:13px; color:#64748b; margin-bottom:12px; }
  .vocab-list { font-size:14px; line-height:1.8; }
  .vocab-list .row { padding:4px 0;border-bottom:1px dashed #e2e8f0; }
  .vocab-list .en { font-weight:600;color:#0f172a; }
  .vocab-list .ph { font-style:italic;color:#64748b;margin:0 8px; }
  .vocab-list .zh { color:#475569; }
  .vocab-list .row:last-child { border-bottom:none; }
  .vocab-close {
    margin-top: 14px; width: 100%; padding: 10px; border-radius: 10px;
    border: none; background: #2563eb; color: #fff; font-size: 15px; cursor: pointer;
  }
</style>
</head>

<script>
let sentences = [];
let originalSentences = [];
let curIdx = 0;
let wordInputs = [];
let targetWords = [];
let submitted = false;
let autoTimer = null;
let listenAutoTimer = null;
let errTipTimer = null;
const LISTEN_AUTO_SEC = 3000;
const TRANSLATE_TIMEOUT = 8000;
let currentMode = "listen";
let shuffleOn = false;
let readZhAfterEn = false;
let showPhoneticOn = false;
// ==========自定义文本本地存储模块==========
const STORAGE_KEY = "english_custom_texts";
function getCustomTexts(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(!raw) return [];
  try{ return JSON.parse(raw); }catch(e){ return []; }
}
function saveCustomTexts(arr){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
}
function addCustomText(text){
  const arr = getCustomTexts();
  const preview = text.substring(0,22).replace(/\r?\n/g," ") + (text.length>22?"…":"");
  arr.push({id: Date.now(), title: preview, content:text});
  saveCustomTexts(arr);
  renderCustomTextUI();
}
function deleteCustomText(id){
  let arr = getCustomTexts();
  arr = arr.filter(i=>i.id !== id);
  saveCustomTexts(arr);
  renderCustomTextUI();
}
/**
 * 导出全部自定义粘贴文本为txt，Blob下载
 */
function exportCustomTextsToTxt(){
  const list = getCustomTexts();
  if(!list.length){
    alert("暂无自定义粘贴文本，无法导出");
    return;
  }
  // 拼接全部内容，每条之间分割线隔开
  let output = "=====英语练习自定义粘贴文本导出=====\n";
  list.forEach(item=>{
    output += "\n--------【"+item.title+"】--------\n";
    output += item.content;
    output += "\n";
  });
  // Blob + download
  const blob = new Blob([output], {type: "text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "english‑custom‑texts.txt";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function renderCustomTextUI(){
  const grid = document.getElementById("custom-text-grid");
  const groupDom = document.getElementById("custom-text-group");
  const list = getCustomTexts();
  if(list.length ===0){
    groupDom.style.display="none";
    grid.innerHTML="";
    return;
  }
  groupDom.style.display="block";
  grid.innerHTML="";
  list.forEach(item=>{
    const wrap = document.createElement("div");
    wrap.className="custom-wrap";
    const loadBtn = document.createElement("button");
    loadBtn.className="unit-btn";
    loadBtn.textContent = item.title;
    loadBtn.title="点击加载该文本";
    loadBtn.onclick = ()=>{
      closeImportModal();
      startPracticeFromText(item.content);
    };
    const delBtn = document.createElement("button");
    delBtn.className="del-btn";
    delBtn.textContent="×";
    delBtn.title="删除这条";
    delBtn.onclick=(e)=>{
      e.stopPropagation();
      deleteCustomText(item.id);
    };
    wrap.appendChild(loadBtn);
    wrap.appendChild(delBtn);
    grid.appendChild(wrap);
  })
}

function fisherYatesShuffle(arr) {
  const copy = [...arr];
  for(let i = copy.length -1; i >0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}
function toggleShuffle(){
  shuffleOn = !shuffleOn;
  const btn = document.getElementById("btnShuffleMode");
  btn.classList.toggle("active", shuffleOn);
  applyShuffle();
}
function toggleReadZh(){
  readZhAfterEn = !readZhAfterEn;
  const btn = document.getElementById("btnReadZh");
  btn.classList.toggle("active", readZhAfterEn);
}
function toggleShowPhonetic(){
  showPhoneticOn = !showPhoneticOn;
  const btn = document.getElementById("btnShowPhonetic");
  btn.classList.toggle("active", showPhoneticOn);
  if(currentMode === "listen" && sentences[curIdx]){
    showListenSentence();
  }
}
function applyShuffle(){
  if(!originalSentences.length) return;
  sentences = shuffleOn ? fisherYatesShuffle(originalSentences) : [...originalSentences];
  curIdx = 0;
  if(currentMode === "listen"){
    showListenSentence();
  }else{
    document.getElementById('correct-bar').innerHTML='';
    document.getElementById('correct-bar').classList.remove('show');
    showSentence();
  }
}
function getWordPhonetic(rawWord) {
  const clean = rawWord.toLowerCase().replace(/[^a-z]/g,"");
  if (!clean) return "";
  return wordDict[clean] || "";
}

function splitSentences(text){
  text=text.trim();
  if(!text)return [];
  const rawLines = text.split(/\r?\n/);
  const res=[];
  function splitEnglishParagraphToSentences(paraText){
    paraText = paraText.trim();
    if(!paraText) return [];
    const parts = paraText.replace(/([.!?])\s+(?=[A-Z])/g,"$1§§SPLIT§§").split("§§SPLIT§§");
    const sentences = [];
    for(let p of parts){
      const s = p.trim();
      if(s && /[A-Za-z]/.test(s)){
        sentences.push(s);
      }
    }
    return sentences;
  }
  for(let rawLine of rawLines){
    const line = rawLine.trim();
    if(!line) continue;
    const phoneticMatch = line.match(/\s+(\/[^\/]+\/)/);
    let en="", phonetic="", zh="";
    if(phoneticMatch){
        phonetic = phoneticMatch[1];
        const beforePh = line.substring(0, phoneticMatch.index).trim();
        const afterPh = line.substring(phoneticMatch.index + phoneticMatch[0].length).trim();
        en = beforePh.replace(/[.!?,;]$/,"").trim();
        zh = afterPh;
        if(en && /[A‑Za‑z]/.test(en)){
          res.push({en, phonetic, zh});
        }
        continue;
    }
    const zhMatch=line.match(/[\u4e00-\u9fff\u3000-\u303f\uff00-\uffef]/);
    if(zhMatch){
        zh=line.slice(zhMatch.index).trim();
        en=line.slice(0,zhMatch.index).replace(/[.!?,;]$/,'').trim();
        if(en && /[A‑Za‑z]/.test(en)){
            res.push({en:en, phonetic:"(无音标)", zh:zh});
        }
    }else{
        //全部统一短文模式，不再区分单词列表
        const subSentences = splitEnglishParagraphToSentences(line);
        for(const subEn of subSentences){
            res.push({
                en: subEn.replace(/[.!?,;]$/,"").trim(),
                phonetic:"(无音标)",
                zh:""
            })
        }
    }
  }
  return res;
}
// 带超时、异常捕获翻译包装，超时直接返回兜底文本
async function translateWithTimeout(en){
  return Promise.race([
    (async ()=>{
      const url='https://api.mymemory.translated.net/get?'+new URLSearchParams({q:en,langpair:'en|zh-CN'});
      const resp=await fetch(url);
      const data=await resp.json();
      const zh=(data.responseData&&data.responseData.translatedText||'').trim();
      return zh||null;
    })(),
    new Promise(resolve=>setTimeout(()=>resolve(null),TRANSLATE_TIMEOUT))
  ]).catch(()=>{
    return null;
  });
}

function clean(s){return s.replace(/[^\w]/g,'');}
function checkWord(inp,target){
  if(!isElementAttached(inp)) return;
  const t=clean(target);const u=clean(inp.value);
  const wasOk=!inp.classList.contains('err');
  inp.classList.remove('err','ok');
  let isWrong=!((t.startsWith(u)&&u.length>0)||u.length===0);
  if(isWrong){
    inp.classList.add('err');
    if(wasOk)inp.dataset.errCount=(parseInt(inp.dataset.errCount||'0',10)+1);
    if(parseInt(inp.dataset.errCount||'0',10)>=3){
      const tip=document.getElementById('err-tip');
      tip.innerHTML=`这个词的正确拼写：<b>${target}</b>`;
      tip.classList.add('show');
      if(errTipTimer)clearTimeout(errTipTimer);
      errTipTimer=setTimeout(()=>tip.classList.remove('show'),2000);
    }
  }
}
function onWordKeydown(e,inp,idx){
  if(!isElementAttached(inp)) return;
  if(e.key===' '){
    e.preventDefault();
    if(idx<wordInputs.length-1 && isElementAttached(wordInputs[idx+1])){
        wordInputs[idx+1].focus();
    }
  }
  else if(e.key==='Backspace'){
    if(inp.value===''&&idx>0){
      e.preventDefault();
      const prev=wordInputs[idx-1];
      if(isElementAttached(prev)){
        prev.focus();
        requestAnimationFrame(()=>prev.setSelectionRange(prev.value.length,prev.value.length));
      }
    }
  }
  else if(e.key==='Enter'){
    e.preventDefault();
    if(submitted){if(autoTimer)clearTimeout(autoTimer);nextSentence();}
    else{finishSentence();}
  }else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='h'){
    e.preventDefault();toggleEnHint();
  }
}
document.addEventListener('keydown', function(e){
  if(currentMode !== 'write') return;
  if(!submitted) return;
  if(e.key !== 'Enter') return;
  const tag = e.target.tagName;
  if(tag === 'TEXTAREA' || tag === 'INPUT') return;
  e.preventDefault();
  if(autoTimer) clearTimeout(autoTimer);
  nextSentence();
});
function finishSentence(){
  if(!wordInputs || wordInputs.length===0) return;
  let correct=0;const total=targetWords.length;const wrong=[];
  wordInputs.forEach((inp,i)=>{
    if(!isElementAttached(inp)) return;
    const user=inp.value.trim();const target=targetWords[i];
    inp.classList.remove('err');
    if(clean(user)===clean(target)){correct++;inp.classList.add('ok');}
    else{wrong.push(`${target} → ${user||'(空)'}`);inp.classList.add('err');}
  });
  submitted=true;
  const acc=total?(correct/total*100).toFixed(1):0;
let msg=`正确 ${correct}/${total}（${acc}%）`;
  if(wrong.length)msg+='\n错词：'+wrong.join('  |  ');
  else msg+='\n✓ 全对！';
  const r=document.getElementById('result');r.textContent=msg;r.classList.add('show');
  const btnNext=document.getElementById('btn-next');btnNext.textContent='下一句 →';btnNext.style.display='inline-block';
  if(!wrong.length){
    addCorrectSentence(sentences[curIdx]);
    const item=sentences[curIdx];

      const utter=new SpeechSynthesisUtterance(item.en);

      utter.onend=()=>{autoTimer=setTimeout(nextSentence,2500);};
      speechSynthesis.speak(utter);

      autoTimer=setTimeout(nextSentence,2500);
    }
  }
}

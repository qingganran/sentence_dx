<!DOCTYPE html>

<style>
  :root {
    --bg: #fffbe6; /* 浅黄色整体背景 */
    --paper: #ffffff;
    --ink: #1f2937;
    --muted: #6b7280;
    --line: #d1d5db;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --green: #16a34a;
    --red: #dc2626;
    --amber-bg: #fef3c7;
    --amber-border: #d97706;
    --amber-ink: #92400e;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",

  /* 顶部操作按钮栏 */

  .bar-row{
    display:flex;

    justify-content:center;
  }
  .action-btn{

  .btn-shuffle{ background:#fecdd3; color:#be123c; }
  .btn-readzh{ background:#d9f99d; color:#4d7c0f; }
  .btn-phonetic{ background:#c4b5fd; color:#5b21b6; }
  .btn-listen{ background:#bbf7d0; color:#15803d; }
  .btn-write{ background:#ddd6fe; color:#6d28d9; }
  .action-btn:hover{ filter:brightness(0.92); }
  .action-btn.active{ outline:2px solid #222; }
  .view { display: none; min-height: calc(100vh - 130px); padding: 16px; }
  .view.active { display: block; }
  textarea {
    width: 100%; min-height: 220px; padding: 14px;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--paper); font-size: 16px; font-family: inherit;
    resize: vertical;
  }
  textarea:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
  /* 默写面板 */

  .progress { color: var(--muted); font-size: 14px; }

  }
  .zh-box {
    text-align: center; font-size: 20px; padding: 12px 8px;

    min-height: 48px;
  }
  .words {
    display: flex; flex-wrap: wrap; justify-content: center;

  .word-input {

  .listen-word-item{

let sentences = [];
let originalSentences = [];
let curIdx = 0;
let wordInputs = [];
let targetWords = [];
let submitted = false;
let autoTimer = null;
let listenAutoTimer = null;
let errTipTimer = null;
const LISTEN_AUTO_SEC = 3000;
const TRANSLATE_TIMEOUT = 8000;
let currentMode = "listen";
let shuffleOn = false;
let readZhAfterEn = false;
let showPhoneticOn = false;
// ==========自定义文本本地存储模块==========
const STORAGE_KEY = "english_custom_texts";
function getCustomTexts(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(!raw) return [];
  try{ return JSON.parse(raw); }catch(e){ return []; }
}
function saveCustomTexts(arr){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
}
function addCustomText(text){
  const arr = getCustomTexts();
  const preview = text.substring(0,22).replace(/\r?\n/g," ") + (text.length>22?"…":"");
  arr.push({id: Date.now(), title: preview, content:text});
  saveCustomTexts(arr);
  renderCustomTextUI();
}
function deleteCustomText(id){
  let arr = getCustomTexts();
  arr = arr.filter(i=>i.id !== id);
  saveCustomTexts(arr);
  renderCustomTextUI();
}
function renderCustomTextUI(){
  const grid = document.getElementById("custom-text-grid");
  const groupDom = document.getElementById("custom-text-group");
  const list = getCustomTexts();
  if(list.length ===0){
    groupDom.style.display="none";
    grid.innerHTML="";
    return;
  }
  groupDom.style.display="block";
  grid.innerHTML="";
  list.forEach(item=>{
    const wrap = document.createElement("div");
    wrap.className="custom-wrap";
    const loadBtn = document.createElement("button");
    loadBtn.className="unit-btn";
    loadBtn.textContent = item.title;
    loadBtn.title="点击加载该文本";
    loadBtn.onclick = ()=>{
      closeImportModal();
      startPracticeFromText(item.content);
    };
    const delBtn = document.createElement("button");
    delBtn.className="del-btn";
    delBtn.textContent="×";
    delBtn.title="删除这条";
    delBtn.onclick=(e)=>{
      e.stopPropagation();
      deleteCustomText(item.id);
    };
    wrap.appendChild(loadBtn);
    wrap.appendChild(delBtn);
    grid.appendChild(wrap);
  })
}

function forceStopRecordIfNeed(){}
const wordDict = {

  "sad":"/sæd/",
  "angry":"/ˈæŋɡri/",
  "tired":"/ˈtaɪəd/",

function fisherYatesShuffle(arr) {
  const copy = [...arr];
  for(let i = copy.length -1; i >0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

/**
 * @param {string} text 原始文本
 */
function splitSentences(text){
  text=text.trim();
  if(!text)return [];
  const rawLines = text.split(/\r?\n/);
  const res=[];
  function splitEnglishParagraphToSentences(paraText){
    paraText = paraText.trim();
    if(!paraText) return [];
    const parts = paraText.replace(/([.!?])\s+(?=[A-Z])/g,"$1§§SPLIT§§").split("§§SPLIT§§");
    const sentences = [];
    for(let p of parts){
      const s = p.trim();
      if(s && /[A-Za-z]/.test(s)){
        sentences.push(s);
      }
    }
    return sentences;
  }
  for(let rawLine of rawLines){
    const line = rawLine.trim();
    if(!line) continue;
    const phoneticMatch = line.match(/\s+(\/[^\/]+\/)/);
    let en="", phonetic="", zh="";
    if(phoneticMatch){
        phonetic = phoneticMatch[1];
        const beforePh = line.substring(0, phoneticMatch.index).trim();
        const afterPh = line.substring(phoneticMatch.index + phoneticMatch[0].length).trim();
        en = beforePh.replace(/[.!?,;]$/,"").trim();
        zh = afterPh;
        if(en && /[A‑Za‑z]/.test(en)){
          res.push({en, phonetic, zh});
        }
        continue;
    }
    const zhMatch=line.match(/[\u4e00-\u9fff\u3000-\u303f\uff00-\uffef]/);
    if(zhMatch){
        zh=line.slice(zhMatch.index).trim();
        en=line.slice(0,zhMatch.index).replace(/[.!?,;]$/,'').trim();
        if(en && /[A‑Za‑z]/.test(en)){
            res.push({en:en, phonetic:"(无音标)", zh:zh});
        }
    }else{
        //全部统一短文模式，不再区分单词列表
        const subSentences = splitEnglishParagraphToSentences(line);
        for(const subEn of subSentences){
            res.push({
                en: subEn.replace(/[.!?,;]$/,"").trim(),
                phonetic:"(无音标)",
                zh:""
            })
        }
    }
  }
  return res;
}

// 带超时、异常捕获翻译包装，超时直接返回兜底文本
async function translateWithTimeout(en){
  return Promise.race([
    (async ()=>{
      const url='https://api.mymemory.translated.net/get?'+new URLSearchParams({q:en,langpair:'en|zh-CN'});
      const resp=await fetch(url);
      const data=await resp.json();
      const zh=(data.responseData&&data.responseData.translatedText||'').trim();
      return zh||null;
    })(),
    new Promise(resolve=>setTimeout(()=>resolve(null),TRANSLATE_TIMEOUT))
  ]).catch(()=>{
    return null;
  });
}

function switchMode(mode){

}

async function startPracticeFromText(text){
  if(!text||!text.trim()){alert('没有可练习的内容，请先导入单词或文件！');return;}

  if(listenAutoTimer){clearTimeout(listenAutoTimer);listenAutoTimer=null;}
  if(errTipTimer){clearTimeout(errTipTimer);errTipTimer=null;}
  if('speechSynthesis' in window) speechSynthesis.cancel();

  submitted = false;
  wordInputs = [];
  targetWords = [];

  document.getElementById('correct-bar').innerHTML='';
  document.getElementById('correct-bar').classList.remove('show');

  originalSentences = splitSentences(text);
  if(!originalSentences.length){alert('未识别到有效句子，请检查文本格式！');return;}
  applyShuffle();
  curIdx=0;

  if(currentMode === "write"){
      switchMode('write');
      return;
  }
  if(currentMode==="listen"){
      await showListenSentence();
  }
}

function isElementAttached(el){
  if(!el) return false;
  return document.documentElement.contains(el);
}

//====重大重构：DOM/输入框创建、focus全部放在await之前，保留用户click可信上下文，浏览器允许focus()生效====
async function showSentence(){
  forceStopRecordIfNeed();
  if(autoTimer){clearTimeout(autoTimer);autoTimer=null;}
  if('speechSynthesis'in window)speechSynthesis.cancel();
  submitted=false;
  wordInputs = [];

  const item=sentences[curIdx];
  targetWords=item.en.split(/\s+/);

  //【同步执行，在await之前，处于用户click可信事件链】
  document.getElementById('progress').textContent=`第 ${curIdx+1} / ${sentences.length} 句`;
  document.getElementById('result').classList.remove('show');
  document.getElementById('btn-next').style.display='none';
  document.getElementById('en-hint').classList.remove('show');
  const errTip=document.getElementById('err-tip');
  errTip.classList.remove('show');errTip.style.background='';errTip.style.borderColor='';errTip.style.color='';
  document.querySelector('.btn-hint-mobile').textContent='显示整句';
  document.getElementById('btn-prev').style.visibility=curIdx===0?'hidden':'visible';

  const zhBox=document.getElementById('zh-box');
  zhBox.textContent='中文意思：加载中…';

  document.getElementById('en-hint').textContent='整句：'+item.en;
  const wordsBox=document.getElementById('words');
  wordsBox.innerHTML='';
  targetWords.forEach((word,i)=>{
    const cleanLen=(word.replace(/[^\w]/g,'')||word).length;
    const inp=document.createElement('input');
    inp.type='text';inp.className='word-input';inp.maxLength=word.length+1;
    inp.style.width=Math.max(60,cleanLen*18)+'px';
    inp.autocomplete='off';inp.autocapitalize='off';inp.spellcheck=false;
    inp.dataset.target=word;inp.dataset.idx=i;inp.dataset.errCount='0';
    inp.addEventListener('input',()=>checkWord(inp,word));
    inp.addEventListener('keydown',(e)=>onWordKeydown(e,inp,i));
    wordsBox.appendChild(inp);
    wordInputs.push(inp);
  });

  //====focus放在await前面！同步执行，用户click上下文没有丢失！====
  if(wordInputs[0] && isElementAttached(wordInputs[0])){
      wordInputs[0].focus();
      wordInputs[0].setSelectionRange(wordInputs[0].value.length,wordInputs[0].value.length);
  }

  // DOM全部渲染、focus做完，再去做异步网络翻译
  let needTranslate = !item.zh;
  if(!needTranslate){
    zhBox.textContent='中文意思：'+item.zh;
  }else{
    const zh=await translateWithTimeout(item.en);
    if(zh){
      item.zh=zh;
      zhBox.textContent='中文意思：'+zh;
    }else{
      item.zh="(网络异常，无中文翻译)";
      zhBox.textContent='中文意思：'+item.zh;
    }
  }
}

async function showListenSentence(){
    forceStopRecordIfNeed();
    if('speechSynthesis' in window) speechSynthesis.cancel();
    if(listenAutoTimer){clearTimeout(listenAutoTimer);listenAutoTimer=null;}
    const item = sentences[curIdx];
    document.getElementById("listen-progress").textContent = `第 ${curIdx+1} / ${sentences.length} 句`;
    let zh = item.zh;
    if(!zh){
        document.getElementById("listen-zh").innerText = "正在翻译中文…";
        zh = await translateWithTimeout(item.en);
        item.zh = zh||"(网络异常，无中文翻译)";
    }
    document.getElementById("listen-zh").innerText = item.zh;
    const wrap = document.getElementById("listen-en-wrap");
    wrap.innerHTML = "";
    const words = item.en.split(/\s+/);
    for(const w of words){
        const div = document.createElement("div");
        div.className = "listen-word-item";
        let phoneticText = getWordPhonetic(w);
        if(showPhoneticOn){
            div.innerHTML = `<div class="listen-word-en">${w}</div><div class="listen-word-phonetic">${phoneticText}</div>`;
        }else{
            div.innerHTML = `<div class="listen-word-en">${w}</div>`;
        }
        wrap.appendChild(div);
    }
    playListenSentence();
}

function playListenSentence(){
    const item = sentences[curIdx];
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const uEn = new SpeechSynthesisUtterance(item.en);
    uEn.lang = "en-US"; uEn.rate = 0.9;
    uEn.onend = function(){
        if(readZhAfterEn && item.zh && item.zh !== "(网络异常，无中文翻译)"){
            const uZh = new SpeechSynthesisUtterance(item.zh);
            uZh.lang = "zh-CN"; uZh.rate = 0.95;
            uZh.onend = function(){
                listenAutoTimer = setTimeout(()=>{ listenNext(); },LISTEN_AUTO_SEC);
            };
            speechSynthesis.speak(uZh);
        }else{
            listenAutoTimer = setTimeout(()=>{ listenNext(); },LISTEN_AUTO_SEC);
        }
    };
    speechSynthesis.speak(uEn);
}
function listenNext(){
    if(listenAutoTimer){clearTimeout(listenAutoTimer);listenAutoTimer=null;}
    curIdx = (curIdx+1) % sentences.length;
    showListenSentence();
}
function listenPrev(){
    if(listenAutoTimer){clearTimeout(listenAutoTimer);listenAutoTimer=null;}
    if(curIdx <=0){alert("已经是第一句");return;}
    curIdx -=1;
    showListenSentence();
}

function clean(s){return s.replace(/[^\w]/g,'');}
function checkWord(inp,target){
  if(!isElementAttached(inp)) return;
  const t=clean(target);const u=clean(inp.value);
  const wasOk=!inp.classList.contains('err');
  inp.classList.remove('err','ok');
  let isWrong=!((t.startsWith(u)&&u.length>0)||u.length===0);
  if(isWrong){
    inp.classList.add('err');
    if(wasOk)inp.dataset.errCount=(parseInt(inp.dataset.errCount||'0',10)+1);
    if(parseInt(inp.dataset.errCount||'0',10)>=3){
      const tip=document.getElementById('err-tip');
      tip.innerHTML=`这个词的正确拼写：<b>${target}</b>`;
      tip.classList.add('show');
      if(errTipTimer)clearTimeout(errTipTimer);
      errTipTimer=setTimeout(()=>tip.classList.remove('show'),2000);
    }
  }
}
function onWordKeydown(e,inp,idx){
  if(!isElementAttached(inp)) return;
  if(e.key===' '){
    e.preventDefault();
    if(idx<wordInputs.length-1 && isElementAttached(wordInputs[idx+1])){
        wordInputs[idx+1].focus();
    }
  }
  else if(e.key==='Backspace'){
    if(inp.value===''&&idx>0){
      e.preventDefault();
      const prev=wordInputs[idx-1];
      if(isElementAttached(prev)){
        prev.focus();
        requestAnimationFrame(()=>prev.setSelectionRange(prev.value.length,prev.value.length));
      }
    }
  }
  else if(e.key==='Enter'){
    e.preventDefault();
    if(submitted){if(autoTimer)clearTimeout(autoTimer);nextSentence();}
    else{finishSentence();}
  }else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='h'){
    e.preventDefault();toggleEnHint();
  }
}
//全局回车监听
document.addEventListener('keydown', function(e){
  if(currentMode !== 'write') return;
  if(!submitted) return;
  if(e.key !== 'Enter') return;
  const tag = e.target.tagName;
  if(tag === 'TEXTAREA' || tag === 'INPUT') return;
  e.preventDefault();
  if(autoTimer) clearTimeout(autoTimer);
  nextSentence();
});
function finishSentence(){
  if(!wordInputs || wordInputs.length===0) return;
  let correct=0;const total=targetWords.length;const wrong=[];
  wordInputs.forEach((inp,i)=>{
    if(!isElementAttached(inp)) return;
    const user=inp.value.trim();const target=targetWords[i];
    inp.classList.remove('err');
    if(clean(user)===clean(target)){correct++;inp.classList.add('ok');}
    else{wrong.push(`${target} → ${user||'(空)'}`);inp.classList.add('err');}
  });
  submitted=true;
  const acc=total?(correct/total*100).toFixed(1):0;
let msg=`正确 ${correct}/${total}（${acc}%）`;
  if(wrong.length)msg+='\n错词：'+wrong.join('  |  ');
  else msg+='\n✓ 全对！';
  const r=document.getElementById('result');r.textContent=msg;r.classList.add('show');
  const btnNext=document.getElementById('btn-next');btnNext.textContent='下一句 →';btnNext.style.display='inline-block';
  if(!wrong.length){
    addCorrectSentence(sentences[curIdx]);
    const item=sentences[curIdx];
    if('speechSynthesis'in window){
      speechSynthesis.cancel();
      const utter=new SpeechSynthesisUtterance(item.en);
      utter.lang='en-US';utter.rate=0.9;
      utter.onend=()=>{autoTimer=setTimeout(nextSentence,2500);};
      speechSynthesis.speak(utter);
    }else{
      autoTimer=setTimeout(nextSentence,2500);
    }
  }
}
function addCorrectSentence(item){
  const bar=document.getElementById('correct-bar');
  const span=document.createElement('span');
  span.className='item';
  span.innerHTML=`<b>${item.en}</b> <span style="color:#15803d">${item.zh||''}</span>`;
  bar.appendChild(span);bar.classList.add('show');
}
function showVocabFull(){
  const list=document.getElementById('vocab-list');
  const sub=document.getElementById('vocab-sub');
  sub.textContent=`共 ${originalSentences.length} 条`;
  list.innerHTML=originalSentences.map((s)=>{
    const phText = s.phonetic === '(无音标)' ? '' : s.phonetic;
    return `<div class="row">
      <span class="en">${s.en}</span> / <span class="ph">${phText}</span> / <span class="zh">${s.zh||''}</span>
    </div>`;
  }).join('');
  document.getElementById('vocab-mask').classList.add('show');
}
function closeVocab(){document.getElementById('vocab-mask').classList.remove('show');}
function nextSentence(){
  if(autoTimer){clearTimeout(autoTimer);autoTimer=null;}
  curIdx=(curIdx+1)%sentences.length;showSentence();
}
function prevSentence(){
  if(autoTimer){clearTimeout(autoTimer);autoTimer=null;}
  if(curIdx<=0){alert('已经是第一句了');return;}
  curIdx--;showSentence();
}
function toggleEnHint(){
  const h=document.getElementById('en-hint');h.classList.toggle('show');
  document.querySelector('.btn-hint-mobile').textContent=h.classList.contains('show')?'隐藏整句':'显示整句';
}
function playSentence(){
  const item=sentences[curIdx];
  if(!item||!('speechSynthesis'in window)){alert('当前浏览器不支持语音合成');return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(item.en);u.lang='en-US';u.rate=0.9;speechSynthesis.speak(u);
}
function loadFile(type){const input=document.getElementById('file-input');input.dataset.type=type||'txt';input.click();}
document.getElementById('file-input').addEventListener('change',async (e)=>{
  const f=e.target.files[0];if(!f)return;
  const type=e.target.dataset.type||'txt';let text='';
  try{
    if(type==='docx'||f.name.endsWith('.docx')){
      const arr=await f.arrayBuffer();
      const result=await mammoth.extractRawText({arrayBuffer:arr});
      text=result.value;
    }else{text=await f.text();}
  }catch(err){alert('文件解析失败：'+err.message);return;}
  startPracticeFromText(text);
});

window.addEventListener('DOMContentLoaded',()=>{
  switchMode('listen');
  loadArticle('unit21');
});
</script>
